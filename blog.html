<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog – TpT Pro Tools</title>
<meta name="description" content="Tips, tutorials and news for TeachersPayTeachers sellers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/blog.css">
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a class="logo" href="index.html"><span>TpT</span> Pro Tools</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="blog.html" class="on">Blog</a></li>
        <li><a href="about.html">About</a></li>
        <li><a class="btn btn-primary btn-sm" href="extension.html">Free extension</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1>Blog & <em>updates</em></h1>
    <p>Tips, tutorials and news for TpT sellers.</p>
  </div>

  <div class="posts" id="posts">
    <noscript><p>Please enable JavaScript to see the articles.</p></noscript>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 TpT Pro Tools. Not affiliated with TeachersPayTeachers.</span>
    <span><a href="index.html">Home</a> · <a href="blog.html">Blog</a> · <a href="about.html">About</a></span>
  </div>
</footer>

<script>
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  fetch('posts.json').then(function(r){return r.json()}).then(function(list){
    list.sort(function(a,b){return b.date.localeCompare(a.date)});
    var html=list.map(function(p){
      var d=new Date(p.date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
      return '<a class="post" href="posts/'+esc(p.slug)+'.html">'+
        '<div class="thumb" style="--c1:'+esc(p.c1)+';--c2:'+esc(p.c2)+'"></div>'+
        '<div class="pbody"><div class="pmeta"><span class="cat">'+esc(p.category)+'</span><time>'+d+'</time></div>'+
        '<h3>'+esc(p.title)+'</h3><p>'+esc(p.summary)+'</p><span class="more">Read more →</span></div></a>';
    }).join('');
    document.getElementById('posts').innerHTML=html;
  }).catch(function(){
    document.getElementById('posts').innerHTML='<p>Articles could not be loaded. Please refresh the page.</p>';
  });
</script>

</body>
</html>
